<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF İndeks Sayfası</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      padding: 40px;
      margin: 0;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }
    .pdf-box {
      background: white;
      border: 2px solid #ccc;
      border-radius: 10px;
      width: 200px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
      transition: transform 0.2s, border-color 0.2s;
    }
    .pdf-box:hover {
      transform: scale(1.05);
      border-color: #0078D7;
    }
    .pdf-box a {
      text-decoration: none;
      color: #0078D7;
      font-weight: bold;
    }
    .toggle-box {
      background: #fff8e1;
      border: 2px solid #fbc02d;
      border-radius: 12px;
      width: 420px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      font-size: 1.2em;
      font-weight: bold;
      color: #f57f17;
      cursor: pointer;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
      transition: transform 0.2s, border-color 0.2s;
    }
    .toggle-box:hover {
      transform: scale(1.03);
      border-color: #f9a825;
    }
    .hidden {
      display: none;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #1e1e1e;
        color: #f0f0f0;
      }
      .pdf-box {
        background: #2c2c2c;
        border-color: #444;
        box-shadow: 2px 2px 10px rgba(255,255,255,0.05);
      }
      .pdf-box a {
        color: #4ea1ff;
      }
      .toggle-box {
        background: #3a3a1e;
        border-color: #fbc02d;
        color: #ffeb3b;
      }
    }
  </style>
</head>
<body>
  <h1>📚 Said Nursî (1878 - 23 Mart 1960) PDF İndeks Sayfası</h1>

  <div class="container">
    <div class="pdf-box">
      <a href="./dosyalar/cevsen-meal.pdf" target="_blank">📄 Cevşen ve Meali PDF</a>
    </div>
    <div class="pdf-box">
      <a href="./dosyalar/Tesbihat.pdf" target="_blank">📄 Tesbihat PDF</a>
    </div>
    <div class="pdf-box">
      <a href="./dosyalar/yemekduasi-a4.pdf" target="_blank">📄 Yemek Duası PDF</a>
    </div>
    <div class="pdf-box">
      <a href="./dosyalar/ASA-KITAB.pdf" target="_blank">📄 ASA-KITAB PDF</a>
    </div>
  </div>

  <!-- Kur’an Cüzleri Başlığı -->
  <div class="container">
    <div class="toggle-box" onclick="toggleCuzler()">📖 Kur’an-ı Kerim Cüzleri (Tıklayınız)</div>
  </div>

  <!-- Cüz Kutuları -->
  <div class="container hidden" id="cuz-container">
    <!-- Cüz 1–30 -->
    <script>
      for (let i = 1; i <= 30; i++) {
        const start = String((i - 1) * 21 + 1).padStart(3, '0');
        const end = String(i * 21).padStart(3, '0');
        document.write(`
          <div class="pdf-box">
            <a href="./kuran.pdf/kuran-${start}-${end}.pdf" target="_blank">📄 Cüz ${i}</a>
          </div>
        `);
      }
    </script>
  </div>

  <script>
    function toggleCuzler() {
      const cuzContainer = document.getElementById("cuz-container");
      cuzContainer.classList.toggle("hidden");
    }
  </script>
</body>
</html>
